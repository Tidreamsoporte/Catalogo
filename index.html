<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Digital 3D - Zona Gamer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #090d16; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }

    /* CONTENEDOR COVER FLOW 3D ADAPTADO A MÓVILES */
    .coverflow-viewport {
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 360px;
      position: relative;
      width: 100%;
    }

    @media (min-width: 768px) {
      .coverflow-viewport { height: 420px; }
    }

    .coverflow-container {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* CARÁTULAS DE JUEGOS - TAMAÑO ADAPTABLE */
    .game-card {
      position: absolute;
      width: 160px;
      height: 230px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.8);
      transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      user-select: none;
      border: none;
      background-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 768px) {
      .game-card {
        width: 220px;
        height: 310px;
        border-radius: 12px;
      }
    }

    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    /* REFLEJO EN EL SUELO */
    .game-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: linear-gradient(to bottom, transparent 65%, rgba(9, 13, 22, 0.85));
      pointer-events: none;
    }

    /* ESTADOS 3D RESPONSIVOS */
    .game-card.active {
      transform: translateX(0) translateZ(120px) rotateY(0deg);
      z-index: 30;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.95);
      filter: brightness(1.1);
    }
    @media (min-width: 768px) {
      .game-card.active { transform: translateX(0) translateZ(160px) rotateY(0deg); }
    }

    .game-card.left-1 { transform: translateX(-110px) translateZ(0px) rotateY(30deg); z-index: 20; opacity: 0.8; filter: brightness(0.6); }
    .game-card.left-2 { transform: translateX(-200px) translateZ(-80px) rotateY(40deg); z-index: 10; opacity: 0.4; filter: brightness(0.3); }
    .game-card.right-1 { transform: translateX(110px) translateZ(0px) rotateY(-30deg); z-index: 20; opacity: 0.8; filter: brightness(0.6); }
    .game-card.right-2 { transform: translateX(200px) translateZ(-80px) rotateY(-40deg); z-index: 10; opacity: 0.4; filter: brightness(0.3); }
    
    @media (min-width: 768px) {
      .game-card.left-1 { transform: translateX(-180px) translateZ(0px) rotateY(35deg); }
      .game-card.left-2 { transform: translateX(-320px) translateZ(-100px) rotateY(45deg); }
      .game-card.right-1 { transform: translateX(180px) translateZ(0px) rotateY(-35deg); }
      .game-card.right-2 { transform: translateX(320px) translateZ(-100px) rotateY(-45deg); }
    }

    .game-card.far-left, .game-card.far-right { opacity: 0; pointer-events: none; }

    /* TOAST NOTIFICACIONES */
    #toastContainer {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      animation: slideIn 0.3s ease forwards, fadeOut 0.3s ease 2.7s forwards;
    }
    @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(10px); } }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">

  <div id="toastContainer"></div>

  <!-- ENCABEZADO RESPONSIVO -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex flex-wrap items-center justify-between gap-3 z-20">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 font-black text-lg shadow-lg shadow-emerald-500/20">
        <i class="fa-solid fa-gamepad"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm sm:text-base text-white leading-none">Zona Gamer</h1>
        <span id="labelModo" class="text-[10px] text-emerald-400 font-medium">Vista de Cliente</span>
      </div>
    </div>

    <div class="flex items-center gap-2 flex-wrap">
      <!-- Filtro de Plataforma -->
      <select id="platformFilter" onchange="cambiarFiltroPlataforma(this.value)" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-lg focus:outline-none cursor-pointer">
        <option value="ALL">Todas las Plataformas</option>
        <option value="Xbox 360">Xbox 360</option>
        <option value="Xbox One">Xbox One</option>
        <option value="PlayStation 1">PlayStation 1</option>
        <option value="PlayStation 2">PlayStation 2</option>
        <option value="PlayStation 3">PlayStation 3</option>
        <option value="PlayStation 4">PlayStation 4</option>
        <option value="PlayStation 5">PlayStation 5</option>
        <option value="Nintendo Switch">Nintendo Switch</option>
        <option value="Nintendo Wii">Nintendo Wii</option>
        <option value="Nintendo Gamecube">Nintendo Gamecube</option>
        <option value="PC">PC / Steam</option>
      </select>

      <!-- Carrito -->
      <button onclick="abrirCarrito()" class="relative bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer">
        <i class="fa-solid fa-cart-shopping text-emerald-400"></i> <span class="hidden sm:inline">Carrito</span>
        <span id="cartCount" class="absolute -top-1.5 -right-1.5 bg-emerald-500 text-slate-950 font-bold text-[9px] w-4 h-4 rounded-full flex items-center justify-center shadow">0</span>
      </button>

      <!-- Botón Admin -->
      <button id="btnToggleModo" onclick="toggleModoSistema()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer">
        <i class="fa-solid fa-user-shield text-blue-400"></i> <span id="textToggleModo" class="hidden sm:inline">Admin</span>
      </button>
    </div>
  </header>

  <!-- SECCIÓN CENTRAL COVER FLOW -->
  <main class="flex-1 flex flex-col items-center justify-center my-2 relative px-2">
    
    <!-- FLECHA IZQUIERDA -->
    <button onclick="mover(-1)" class="absolute left-2 sm:left-6 z-40 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-slate-900/80 border border-slate-700 hover:border-emerald-500 text-white hover:text-emerald-400 flex items-center justify-center text-sm sm:text-base backdrop-blur-md transition shadow-lg active:scale-95 cursor-pointer">
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    <!-- ESCENARIO -->
    <div class="coverflow-viewport w-full">
      <div id="coverflowContainer" class="coverflow-container"></div>
    </div>

    <!-- FLECHA DERECHA -->
    <button onclick="mover(1)" class="absolute right-2 sm:right-6 z-40 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-slate-900/80 border border-slate-700 hover:border-emerald-500 text-white hover:text-emerald-400 flex items-center justify-center text-sm sm:text-base backdrop-blur-md transition shadow-lg active:scale-95 cursor-pointer">
      <i class="fa-solid fa-chevron-right"></i>
    </button>

  </main>

  <!-- FICHA INFERIOR ADAPTABLE -->
  <footer class="bg-slate-900/95 border-t border-slate-800 p-4 sm:p-5 backdrop-blur-xl z-20">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <div class="text-center sm:text-left space-y-1 w-full sm:w-auto">
        <div class="flex items-center justify-center sm:justify-start gap-2">
          <span id="juegoPlataformaBadge" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider">Plataforma</span>
          <span id="juegoPeso" class="text-slate-400 font-mono text-xs"><i class="fa-solid fa-hard-drive mr-1"></i> 0 GB</span>
        </div>
        <h2 id="juegoTitulo" class="text-lg sm:text-xl font-black text-white tracking-wide truncate max-w-xs sm:max-w-md mx-auto sm:mx-0">Cargando...</h2>
      </div>

      <div class="flex items-center justify-between sm:justify-end gap-4 w-full sm:w-auto bg-slate-950/60 border border-slate-800/80 px-4 py-2.5 rounded-xl">
        <div class="text-left sm:text-right">
          <span class="text-[9px] text-slate-400 uppercase font-bold block">Valor</span>
          <span id="juegoPrecio" class="text-xl font-black text-emerald-400 font-mono">$0</span>
        </div>

        <button id="btnAgregarCarrito" onclick="agregarAlCarrito()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold px-4 py-2.5 rounded-lg shadow-lg shadow-emerald-500/20 text-xs transition uppercase tracking-wider flex items-center gap-2 active:scale-95 cursor-pointer">
          <i class="fa-solid fa-cart-plus text-sm"></i> Agregar
        </button>
      </div>

    </div>
  </footer>

  <!-- MODAL CONTRASEÑA ADMIN -->
  <div id="passwordModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl p-6 space-y-4">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 bg-blue-500/10 border border-blue-500/30 rounded-full flex items-center justify-center mx-auto text-blue-400 text-xl mb-2">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h3 class="text-base font-bold text-white">Acceso Restringido</h3>
        <p class="text-xs text-slate-400">Ingrese la contraseña de administrador</p>
      </div>
      <form onsubmit="verificarPasswordAdmin(event)" class="space-y-3">
        <input type="password" id="inputAdminPass" required autofocus class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white text-center tracking-widest focus:outline-none focus:border-blue-500" placeholder="••••">
        <div class="flex gap-2 pt-1">
          <button type="button" onclick="cerrarPasswordModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition cursor-pointer">Cancelar</button>
          <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-extrabold py-2.5 rounded-xl text-xs transition cursor-pointer">Ingresar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL ADMIN -->
  <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 sm:p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
      <div class="bg-slate-950 px-5 py-3.5 border-b border-slate-800 flex justify-between items-center">
        <h3 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-gear text-blue-400"></i> Panel de Administración
        </h3>
        <button onclick="cerrarAdmin()" class="text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="p-4 sm:p-6 overflow-y-auto flex-1 space-y-6">
        <form id="gameForm" onsubmit="guardarJuegoForm(event)" class="bg-slate-950/60 p-4 sm:p-5 rounded-xl border border-slate-800 grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input type="hidden" id="editIndex" value="-1">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Título del Juego</label>
            <input type="text" id="formTitulo" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="Ej. Halo 3">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Plataforma</label>
            <select id="formPlataforma" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-emerald-500">
              <option value="Xbox 360">Xbox 360</option>
              <option value="Xbox One">Xbox One</option>
              <option value="PlayStation 1">PlayStation 1</option>
              <option value="PlayStation 2">PlayStation 2</option>
              <option value="PlayStation 3">PlayStation 3</option>
              <option value="PlayStation 4">PlayStation 4</option>
              <option value="PlayStation 5">PlayStation 5</option>
              <option value="Nintendo Switch">Nintendo Switch</option>
              <option value="Nintendo Wii">Nintendo Wii</option>
              <option value="Nintendo Gamecube">Nintendo Gamecube</option>
              <option value="PC">PC / Steam</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Peso (Ej. 8.5 GB)</label>
            <input type="text" id="formPeso" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="Ej. 12.0 GB">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Valor ($)</label>
            <input type="number" step="1" id="formValor" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="Ej. 15000">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-300 mb-1">URL de la Carátula (GitHub Raw)</label>
            <input type="url" id="formCaratula" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="https://raw.githubusercontent.com/usuario/repo/main/imagen.png">
          </div>
          <div class="sm:col-span-2 flex justify-end gap-2 pt-2">
            <button type="button" onclick="limpiarFormulario()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-2 rounded-xl text-xs transition cursor-pointer">Cancelar</button>
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-extrabold px-4 py-2 rounded-xl text-xs transition cursor-pointer">Guardar Juego</button>
          </div>
        </form>

        <div>
          <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Listado Registrado</h4>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs sm:text-sm text-slate-300">
              <thead class="bg-slate-950 text-slate-400 uppercase text-[10px] sm:text-[11px]">
                <tr>
                  <th class="p-2 sm:p-3">Carátula</th>
                  <th class="p-2 sm:p-3">Título</th>
                  <th class="p-2 sm:p-3">Plataforma</th>
                  <th class="p-2 sm:p-3">Valor</th>
                  <th class="p-2 sm:p-3 text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaJuegosBody" class="divide-y divide-slate-800"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL CARRITO -->
  <div id="cartModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 sm:p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
      <div class="bg-slate-950 px-5 py-3.5 border-b border-slate-800 flex justify-between items-center">
        <h3 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-cart-shopping text-emerald-400"></i> Carrito de Compras
        </h3>
        <button onclick="cerrarCarrito()" class="text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="p-4 sm:p-6 overflow-y-auto flex-1 space-y-3" id="cartItemsContainer"></div>

      <div class="bg-slate-950 px-4 sm:px-6 py-3.5 border-t border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3">
        <div>
          <span class="text-[10px] text-slate-400 block uppercase font-bold">Total a Pagar</span>
          <span id="cartTotalAmount" class="text-xl sm:text-2xl font-black text-emerald-400 font-mono">$0</span>
        </div>
        <div class="flex items-center gap-2 flex-wrap justify-end w-full sm:w-auto">
          <button onclick="descargarListadoTXT()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-3 py-2 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-download"></i> .TXT
          </button>
          <button onclick="enviarWhatsApp()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-2 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp
          </button>
          <button onclick="simularPago()" class="bg-blue-600 hover:bg-blue-500 text-white font-extrabold px-4 py-2 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-credit-card"></i> Pagar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const claveSeguraBase64 = "MTIzNA==";

    // JUEGOS POR DEFECTO USANDO RAW DE GITHUB O ENLACES ESTABLES PÚBLICOS
    const juegosDefault = [
      { id: 1, titulo: 'Spider-Man 2', plataforma: 'PlayStation 5', peso: '85.4 GB', valor: 59990, caratula: 'https://raw.githubusercontent.com/Tidreamsoporte/Catalogo/refs/heads/main/SCES-50300.png' },
      { id: 2, titulo: 'God of War Ragnarök', plataforma: 'PlayStation 4', peso: '90.2 GB', valor: 49990, caratula: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400&q=80' },
      { id: 3, titulo: 'Elden Ring', plataforma: 'PC', peso: '45.0 GB', valor: 44990, caratula: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400&q=80' }
    ];

    let juegos = JSON.parse(localStorage.getItem('catalogo_juegos_3d')) || juegosDefault;
    let carrito = JSON.parse(localStorage.getItem('carrito_juegos_3d')) || [];
    let indiceActual = 0;
    let filtroPlataforma = 'ALL';
    let modoAdmin = false;

    function mostrarToast(mensaje, tipo = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      let icono = '<i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>';
      if (tipo === 'error') icono = '<i class="fa-solid fa-circle-exclamation text-red-400 text-sm"></i>';
      if (tipo === 'info') icono = '<i class="fa-solid fa-circle-info text-blue-400 text-sm"></i>';
      toast.innerHTML = `${icono} <span>${mensaje}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function obtenerJuegosFiltrados() {
      if (filtroPlataforma === 'ALL') return juegos;
      return juegos.filter(j => j.plataforma === filtroPlataforma);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderizarCoverflow();
      actualizarDetalles();
      actualizarContadorCarrito();

      // Soporte de gestos táctiles básicos (Swipe) para móviles
      let touchStartX = 0;
      let touchEndX = 0;
      const viewport = document.querySelector('.coverflow-viewport');
      
      viewport.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, false);
      viewport.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        if (touchEndX < touchStartX - 50) mover(1);
        if (touchEndX > touchStartX + 50) mover(-1);
      }, false);
    });

    function toggleModoSistema() {
      if (!modoAdmin) {
        document.getElementById('inputAdminPass').value = '';
        document.getElementById('passwordModal').classList.remove('hidden');
        document.getElementById('inputAdminPass').focus();
      } else {
        modoAdmin = false;
        document.getElementById('labelModo').innerText = "Vista de Cliente";
        document.getElementById('textToggleModo').innerText = "Admin";
        renderizarCoverflow();
        mostrarToast("Sesión cerrada", "info");
      }
    }

    function cerrarPasswordModal() { document.getElementById('passwordModal').classList.add('hidden'); }

    function verificarPasswordAdmin(e) {
      e.preventDefault();
      const pass = document.getElementById('inputAdminPass').value;
      if (btoa(pass) === claveSeguraBase64) {
        modoAdmin = true;
        cerrarPasswordModal();
        abrirAdmin();
        mostrarToast("Acceso concedido", "success");
      } else {
        mostrarToast("Contraseña incorrecta", "error");
        document.getElementById('inputAdminPass').value = '';
      }
    }

    function renderizarCoverflow() {
      const container = document.getElementById('coverflowContainer');
      container.innerHTML = '';
      const listaActiva = obtenerJuegosFiltrados();
      
      if (listaActiva.length === 0) {
        container.innerHTML = `<div class="text-slate-400 text-xs sm:text-sm font-semibold text-center px-4">No hay juegos para esta plataforma.</div>`;
        actualizarDetalles();
        return;
      }

      if (indiceActual >= listaActiva.length) indiceActual = 0;

      listaActiva.forEach((juego, i) => {
        const card = document.createElement('div');
        card.className = `game-card ${obtenerClasePosicion(i, indiceActual)}`;
        card.onclick = () => seleccionar(i);
        card.innerHTML = `<img src="${juego.caratula}" alt="${juego.titulo}" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&q=80'">`;
        container.appendChild(card);
      });
      actualizarDetalles();
    }

    function obtenerClasePosicion(index, actual) {
      const diff = index - actual;
      if (diff === 0) return 'active';
      if (diff === -1) return 'left-1';
      if (diff === -2) return 'left-2';
      if (diff < -2) return 'far-left';
      if (diff === 1) return 'right-1';
      if (diff === 2) return 'right-2';
      if (diff > 2) return 'far-right';
    }

    function mover(dir) {
      const listaActiva = obtenerJuegosFiltrados();
      if (listaActiva.length === 0) return;
      const nuevo = indiceActual + dir;
      if (nuevo >= 0 && nuevo < listaActiva.length) {
        indiceActual = nuevo;
        renderizarCoverflow();
      }
    }

    function seleccionar(i) { indiceActual = i; renderizarCoverflow(); }
    function cambiarFiltroPlataforma(val) { filtroPlataforma = val; indiceActual = 0; renderizarCoverflow(); }

    function actualizarDetalles() {
      const listaActiva = obtenerJuegosFiltrados();
      if (listaActiva.length === 0) {
        document.getElementById('juegoTitulo').innerText = "Sin juegos";
        document.getElementById('juegoPlataformaBadge').innerText = "---";
        document.getElementById('juegoPeso').innerHTML = `<i class="fa-solid fa-hard-drive mr-1"></i> 0 GB`;
        document.getElementById('juegoPrecio').innerText = "$0";
        return;
      }
      const j = listaActiva[indiceActual];
      document.getElementById('juegoTitulo').innerText = j.titulo;
      document.getElementById('juegoPlataformaBadge').innerText = j.plataforma;
      document.getElementById('juegoPeso').innerHTML = `<i class="fa-solid fa-hard-drive mr-1"></i> ${j.peso}`;
      document.getElementById('juegoPrecio').innerText = `$${Number(j.valor).toLocaleString()}`;
    }

    function agregarAlCarrito() {
      const listaActiva = obtenerJuegosFiltrados();
      if (listaActiva.length === 0) return;
      const juego = listaActiva[indiceActual];
      if (!carrito.some(item => item.id === juego.id)) {
        carrito.push(juego);
        localStorage.setItem('carrito_juegos_3d', JSON.stringify(carrito));
        actualizarContadorCarrito();
        mostrarToast(`"${juego.titulo}" agregado`);
      } else {
        mostrarToast("Ya está en el carrito", "info");
      }
    }

    function actualizarContadorCarrito() { document.getElementById('cartCount').innerText = carrito.length; }
    function abrirCarrito() { renderizarItemsCarrito(); document.getElementById('cartModal').classList.remove('hidden'); }
    function cerrarCarrito() { document.getElementById('cartModal').classList.add('hidden'); }

    function renderizarItemsCarrito() {
      const container = document.getElementById('cartItemsContainer');
      container.innerHTML = '';
      if (carrito.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-xs sm:text-sm text-center py-6">Tu carrito está vacío.</p>`;
        document.getElementById('cartTotalAmount').innerText = "$0";
        return;
      }
      let total = 0;
      carrito.forEach((item, index) => {
        total += item.valor;
        container.innerHTML += `
          <div class="flex items-center justify-between bg-slate-950 p-2.5 sm:p-3 rounded-xl border border-slate-800 gap-2">
            <div class="flex items-center gap-3 overflow-hidden">
              <img src="${item.caratula}" class="w-10 h-14 object-cover rounded-lg border border-slate-700 flex-shrink-0">
              <div class="truncate">
                <h4 class="font-bold text-white text-xs sm:text-sm truncate">${item.titulo}</h4>
                <span class="text-[10px] sm:text-[11px] text-emerald-400">${item.plataforma}</span>
              </div>
            </div>
            <div class="flex items-center gap-3 flex-shrink-0">
              <span class="font-mono font-bold text-xs sm:text-sm text-emerald-400">$${Number(item.valor).toLocaleString()}</span>
              <button onclick="eliminarDelCarrito(${index})" class="text-red-400 hover:text-red-300 text-xs cursor-pointer"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      });
      document.getElementById('cartTotalAmount').innerText = `$${Number(total).toLocaleString()}`;
    }

    function eliminarDelCarrito(i) {
      carrito.splice(i, 1);
      localStorage.setItem('carrito_juegos_3d', JSON.stringify(carrito));
      actualizarContadorCarrito();
      renderizarItemsCarrito();
      mostrarToast("Eliminado", "info");
    }

    function descargarListadoTXT() {
      if (carrito.length === 0) return mostrarToast("Carrito vacío", "error");
      let contenido = "=== JUEGOS SELECCIONADOS ===\n\n";
      let total = 0;
      carrito.forEach((item, i) => {
        contenido += `${i + 1}. ${item.titulo} (${item.plataforma}) - $${Number(item.valor).toLocaleString()}\n`;
        total += item.valor;
      });
      contenido += `\nTOTAL: $${Number(total).toLocaleString()}\n`;
      const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'juegos.txt'; a.click();
      URL.revokeObjectURL(url);
    }

    function enviarWhatsApp() {
      if (carrito.length === 0) return mostrarToast("Carrito vacío", "error");
      let msg = "Hola, me interesan:%0A";
      let total = 0;
      carrito.forEach(i => { msg += `%0A- ${i.titulo} (${i.plataforma}) [$${Number(i.valor).toLocaleString()}]`; total += i.valor; });
      msg += `%0A%0A*Total:* $${Number(total).toLocaleString()}`;
      window.open(`https://wa.me/?text=${msg}`, '_blank');
    }

    function simularPago() {
      if (carrito.length === 0) return mostrarToast("Carrito vacío", "error");
      mostrarToast("¡Pago simulado con éxito!");
      carrito = [];
      localStorage.removeItem('carrito_juegos_3d');
      actualizarContadorCarrito();
      cerrarCarrito();
    }

    function abrirAdmin() {
      modoAdmin = true;
      document.getElementById('labelModo').innerText = "Modo Administrador";
      document.getElementById('textToggleModo').innerText = "Salir";
      renderizarTablaAdmin();
      document.getElementById('adminModal').classList.remove('hidden');
    }

    function cerrarAdmin() {
      document.getElementById('adminModal').classList.add('hidden');
      renderizarCoverflow();
    }

    function renderizarTablaAdmin() {
      const tbody = document.getElementById('tablaJuegosBody');
      tbody.innerHTML = '';
      if (juegos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">Sin juegos.</td></tr>`;
        return;
      }
      juegos.forEach((j, index) => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-900/50">
            <td class="p-2 sm:p-3"><img src="${j.caratula}" class="w-8 h-12 object-cover rounded border border-slate-700"></td>
            <td class="p-2 sm:p-3 font-bold text-white truncate max-w-[100px] sm:max-w-none">${j.titulo}</td>
            <td class="p-2 sm:p-3"><span class="bg-slate-800 text-blue-400 text-[10px] px-2 py-0.5 rounded border border-slate-700">${j.plataforma}</span></td>
            <td class="p-2 sm:p-3 font-semibold text-emerald-400">$${Number(j.valor).toLocaleString()}</td>
            <td class="p-2 sm:p-3 text-center space-x-2">
              <button onclick="editarJuego(${index})" class="text-blue-400 cursor-pointer"><i class="fa-solid fa-pen"></i></button>
              <button onclick="eliminarJuego(${index})" class="text-red-400 cursor-pointer"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      });
    }

    function guardarJuegoForm(e) {
      e.preventDefault();
      const editIndex = parseInt(document.getElementById('editIndex').value);
      const nuevo = {
        id: editIndex === -1 ? Date.now() : juegos[editIndex].id,
        titulo: document.getElementById('formTitulo').value.trim(),
        plataforma: document.getElementById('formPlataforma').value,
        peso: document.getElementById('formPeso').value.trim(),
        valor: Number(document.getElementById('formValor').value),
        caratula: document.getElementById('formCaratula').value.trim()
      };

      if (editIndex === -1) {
        juegos.push(nuevo);
        mostrarToast("Juego agregado");
      } else {
        juegos[editIndex] = nuevo;
        mostrarToast("Juego actualizado");
        document.getElementById('editIndex').value = -1;
      }
      localStorage.setItem('catalogo_juegos_3d', JSON.stringify(juegos));
      document.getElementById('gameForm').reset();
      renderizarTablaAdmin();
    }

    function editarJuego(index) {
      const j = juegos[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('formTitulo').value = j.titulo;
      document.getElementById('formPlataforma').value = j.plataforma;
      document.getElementById('formPeso').value = j.peso;
      document.getElementById('formValor').value = j.valor;
      document.getElementById('formCaratula').value = j.caratula;
    }

    function eliminarJuego(index) {
      if (confirm("¿Eliminar juego?")) {
        juegos.splice(index, 1);
        localStorage.setItem('catalogo_juegos_3d', JSON.stringify(juegos));
        renderizarTablaAdmin();
        mostrarToast("Eliminado", "info");
      }
    }

    function limpiarFormulario() {
      document.getElementById('gameForm').reset();
      document.getElementById('editIndex').value = -1;
    }
  </script>
</body>
</html>
